                      "detail": "Τελικό ROSA 4. Το αποτέλεσμα δεν αποκλείει επιμέρους εργονομικά ευρήματα ή συμπτώματα."
                  },
              ],
              "recommendations": [
                  {
                      "priority": "soon",
                      "title": "Βελτίωση θέσης πληκτρολογίου και ποντικιού",
                      "action": "Μετακίνησε πληκτρολόγιο και ποντίκι πιο κοντά στο σώμα και εξασφάλισε άνετη στήριξη αντιβραχίων χωρίς ανύψωση ώμων.",
                      "rationale": "Στόχος είναι η μείωση περιττού reaching και στατικής επιβάρυνσης ώμου/άνω άκρου."
                  },
                  {
                      "priority": "soon",
                      "title": "Περισσότερη εναλλαγή στάσης",
                      "action": "Ενσωμάτωσε συχνότερες μικρές αλλαγές θέσης και σύντομα ενεργά διαλείμματα που ταιριάζουν στη ροή εργασίας.",
                      "rationale": "Δεν χρησιμοποιείται ένα υποχρεωτικό καθολικό interval· στόχος είναι να μειωθούν τα παρατεταμένα στατικά διαστήματα."
                  },
                  {
                      "priority": "soon",
                      "title": "Μείωση αντανακλάσεων",
                      "action": "Ρύθμισε τη θέση/γωνία της οθόνης ή τη σκίαση ώστε να περιοριστούν οι αντανακλάσεις από το παράθυρο.",
                      "rationale": "Η οπτική άνεση αποτελεί ξεχωριστό μέρος της DSE αξιολόγησης."
                  },
                  {
                      "priority": "maintain",
                      "title": "Διατήρηση ουδέτερης θέσης άνω άκρων",
                      "action": "Διατήρησε τους αγκώνες κοντά στο σώμα και τους καρπούς όσο γίνεται σε ουδέτερη θέση.",
                      "rationale": "Η μεταβλητότητα και η άνετη υποστήριξη είναι προτιμότερες από μία άκαμπτη 'τέλεια' στάση."
                  },
              ],
              "comparison": {},
          }

          photos = [
              {
                  "name": "01_monitor_position.jpg",
                  "comment": "Η οθόνη βρίσκεται σχετικά χαμηλά και ελαφρώς μακριά από τον εργαζόμενο. Προτείνεται μικρή ανύψωση και επανέλεγχος της απόστασης θέασης.",
                  "data": office_scene(1),
              },
              {
                  "name": "02_chair_armrests.jpg",
                  "comment": "Τα μπράτσα της καρέκλας περιορίζουν την προσέγγιση στο γραφείο, με αποτέλεσμα ο εργαζόμενος να κάθεται λίγο πιο πίσω από την επιφάνεια εργασίας.",
                  "data": office_scene(2),
              },
              {
                  "name": "03_keyboard_mouse_glare.jpg",
                  "comment": "Το πληκτρολόγιο και το ποντίκι βρίσκονται πιο μακριά από το σώμα και υπάρχει πιθανή θάμβωση από το παράθυρο στο πλάι της οθόνης.",
                  "data": office_scene(3),
              },
          ]

          pdf = build_assessment_pdf(
              payload,
              photos=photos,
              logo_path="assets/logo.png",
              lang="el",
          )
          assert pdf.startswith(b"%PDF-"), "PDF signature missing"
          assert len(pdf) > 20000, "PDF unexpectedly small"
          with open("sample_report.pdf", "wb") as f:
              f.write(pdf)
          print(f"PDF moderate demo OK: {len(pdf)} bytes")
          PY
      - name: Upload sample report
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdf-report
          path: sample_report.pdf
          retention-days: 1
